name: sep10-v2

on:
  push:
    branches: [sep10-v2]

permissions:
  contents: write

env:
  MLB_TIMEZONE: America/New_York

jobs:
  board:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - name: Download Statcast history
        run: daily-hr-ingest "2026-06-01" "2026-09-09" data/raw/statcast.csv --chunk-days 7
      - name: Build training table
        run: daily-hr-build data/raw/statcast.csv data/processed/hr_training.parquet
      - name: Train calibrated model
        run: daily-hr-train data/processed/hr_training.parquet --model-out models/hr_model.joblib
      - name: Build Sep 10 board
        run: |
          python -m daily_hr.daily_board \
            data/raw/statcast.csv \
            models/hr_model.joblib \
            models/hr_model.features.json \
            reports/sep10_v1_board.csv \
            --date "2026-09-10"
      - name: Apply V2 scorer
        run: python -m daily_hr.v2_scorer reports/sep10_v1_board.csv reports/sep10_v2_board.csv
      - name: Publish board
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/sep10_v1_board.csv reports/sep10_v2_board.csv
          git commit -m "Publish Sep 10 V2 HR board" || exit 0
          git push origin "HEAD:${GITHUB_REF_NAME}"
