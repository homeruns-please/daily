name: daily-hr-board

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:

jobs:
  board:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - name: Set dates
        run: |
          echo "START=2026-06-01" >> "$GITHUB_ENV"
          echo "END=$(date -u -d 'yesterday' +%F)" >> "$GITHUB_ENV"
          echo "TODAY=$(date -u +%F)" >> "$GITHUB_ENV"
      - name: Download recent Statcast
        run: daily-hr-ingest "$START" "$END" data/raw/statcast.csv --chunk-days 7
      - name: Build training table
        run: daily-hr-build data/raw/statcast.csv data/processed/hr_training.parquet
      - name: Train calibrated model
        run: daily-hr-train data/processed/hr_training.parquet --model-out models/hr_model.joblib
      - name: Build today's board
        run: |
          python -m daily_hr.daily_board \
            data/raw/statcast.csv \
            models/hr_model.joblib \
            models/hr_model.features.json \
            reports/hr_board.csv \
            --date "$TODAY"
      - uses: actions/upload-artifact@v4
        with:
          name: daily-hr-board-${{ env.TODAY }}
          path: |
            reports/hr_board.csv
            models/hr_model.joblib
            models/hr_model.features.json
            data/raw/statcast.csv
          retention-days: 7
