name: backtest-sep4-6

on:
  push:
    paths:
      - ".github/workflows/backtest-sep4-6.yml"
      - "src/daily_hr/backtest.py"
      - "src/daily_hr/v2_scorer.py"

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - name: Download Statcast history
        run: |
          daily-hr-ingest "2026-06-01" "2026-09-06" data/raw/statcast.csv --chunk-days 7
      - name: Run walk-forward backtest
        run: |
          python -m daily_hr.backtest \
            data/raw/statcast.csv \
            reports/backtest_sep4_6.csv \
            --start "2026-09-04" \
            --end "2026-09-06"
      - name: Publish backtest output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/backtest_sep4_6.csv reports/backtest_sep4_6_summary.csv
          git commit -m "Publish Sep 4-6 V1/V2 backtest output" || exit 0
          git push origin "HEAD:${GITHUB_REF_NAME}"
