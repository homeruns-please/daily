name: live-hr-board

on:
  schedule:
    - cron: "17,47 0-5,16-23 * * *"
  workflow_dispatch:

permissions:
  actions: read

jobs:
  live-board:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - name: Set date
        run: echo "TODAY=$(date -u +%F)" >> "$GITHUB_ENV"
      - name: Download today's model package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p live-artifact
          gh run download \
            --repo "$GITHUB_REPOSITORY" \
            --name "daily-hr-board-${TODAY}" \
            --dir live-artifact
      - name: Build live calibrated board
        run: |
          daily-hr-live-board \
            live-artifact/data/raw/statcast.csv \
            live-artifact/models/hr_model.joblib \
            live-artifact/models/hr_model.features.json \
            reports/hr_live_board.csv \
            --date "$TODAY"
      - name: Save timestamped live snapshot
        run: |
          mkdir -p "reports/live_snapshots/${TODAY}"
          cp reports/hr_live_board.csv \
            "reports/live_snapshots/${TODAY}/snapshot-${GITHUB_RUN_ID}.csv"
      - uses: actions/upload-artifact@v4
        with:
          name: live-hr-board-${{ env.TODAY }}-${{ github.run_id }}
          path: |
            reports/hr_live_board.csv
            reports/live_snapshots/${{ env.TODAY }}/snapshot-${{ github.run_id }}.csv
          retention-days: 14
