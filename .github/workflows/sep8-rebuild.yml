name: sep8-rebuild

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  board:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - name: Download pre-Sep-8 Statcast
        run: daily-hr-ingest "2026-06-01" "2026-09-07" data/raw/statcast.csv --chunk-days 7
      - name: Build training table
        run: daily-hr-build data/raw/statcast.csv data/processed/hr_training.parquet
      - name: Train calibrated model
        run: daily-hr-train data/processed/hr_training.parquet --model-out models/hr_model.joblib
      - name: Build Sep 8 board
        run: |
          python -m daily_hr.daily_board \
            data/raw/statcast.csv \
            models/hr_model.joblib \
            models/hr_model.features.json \
            reports/hr_board.csv \
            --date "2026-09-08"
      - name: Apply production scorer
        run: python -c "from pathlib import Path; from daily_hr.production_scorer import rerank_csv; rerank_csv(Path('reports/hr_board.csv'), Path('reports/hr_board.csv'))"
      - name: Publish board to output branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b sep8-output
          cp reports/hr_board.csv reports/sep8_model_board.csv
          git add reports/sep8_model_board.csv
          git commit -m "Publish Sep 8 model board"
          git push origin sep8-output
