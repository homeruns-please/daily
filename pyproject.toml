[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-hr"
version = "0.1.0"
description = "Leakage-safe MLB daily home-run probability modeling"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "pyarrow>=17.0",
  "requests>=2.32",
  "pydantic>=2.8",
  "joblib>=1.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
]

[project.scripts]
daily-hr-ingest = "daily_hr.ingest:main"
daily-hr-build = "daily_hr.dataset:main"
daily-hr-train = "daily_hr.train:main"
daily-hr-live-board = "daily_hr.live_calibration:main"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint.isort]
known-first-party = ["daily_hr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
